name: Build -> Package -> Deploy

on:
  push:
    branches: [ "main" ]


jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Build the Docker image
      - uses: actions/checkout@v4

      - name: setup java
      - uses: actions/setup-java@v5
        with:
            distribution: temurin
            java-version: '21'


      - name: Build jar
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests


      - name: Login to Dockerhub
        uses: docker/login-action@v4
        with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME}}/coaching-ci-pipeline:latest


      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME}}/coaching-ci-pipeline:latest

      - name: SSH to EC2
        uses: appleboy/ssh-action@v1
        with:
            host: ${{ secrets.EC2_HOST}}
            username: ${{ secrets.EC2_USER  }}
            key: ${{ secrets.EC2_SSH }}
            script: |
              docker stop coaching || true
              docker rm coaching || true
              docker pull ${{ secrets.DOCKER_USERNAME}}/coaching-ci-pipeline:latest
              docker run -d --name coaching -p 8080:8080 ${{ secrets.DOCKER_USERNAME}}/coaching-ci-pipeline:latest
