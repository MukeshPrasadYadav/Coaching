name: Build -> Package -> Deploy

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3. Build Spring Boot JAR
      - name: Build JAR
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/coaching-ci-pipeline:latest \
            .

      # 6. Push Docker image
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/coaching-ci-pipeline:latest

      # 7. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH }}

          script: |
            # Stop old container
            docker stop coaching || true

            # Remove old container
            docker rm coaching || true

            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/coaching-ci-pipeline:latest

            # Start new container
            docker run -d \
              --name coaching \
              -p 8080:8080 \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e BREVO_HOST="${{ secrets.BREVO_HOST }}" \
              -e BREVO_PORT="${{ secrets.BREVO_PORT }}" \
              -e BREVO_USERNAME="${{ secrets.BREVO_USERNAME }}" \
              -e BREVO_PASSWORD="${{ secrets.BREVO_PASSWORD }}" \
              -e AWS_ACCESS_KEY="${{ secrets.AWS_ACCESS_KEY }}" \
              -e AWS_SECRET_KEY="${{ secrets.AWS_SECRET_KEY }}" \
              -e JWT_SECURITY="${{ secrets.JWT_SECURITY }}" \
              ${{ secrets.DOCKER_USERNAME }}/coaching-ci-pipeline:latest

            # Show running container
            docker ps